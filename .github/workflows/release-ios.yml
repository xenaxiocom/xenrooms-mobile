name: Release iOS (TestFlight)

# ios/ is not committed: `expo prebuild` makes it on every run, so every
# native setting lives in apps/xenrooms/app.config.js. The steps follow the
# Xenaxio app's workflow (xenaxiocom/native), without its extensions.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the build to TestFlight (off = build the IPA only)"
        type: boolean
        required: false
        default: true

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      # App Store Connect refuses a build number it has seen for this version.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Check for signing credentials
        id: creds
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$ASC_KEY" ] && [ -n "$TEAM" ] && [ -n "$PROFILE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The Apple signing secrets are not set: compiling without signing, no IPA."
          fi

      - name: Install the provisioning profile
        if: steps.creds.outputs.signed == 'true'
        id: profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          PROFILE="$RUNNER_TEMP/app.mobileprovision"
          echo "$PROFILE_BASE64" | base64 -d > "$PROFILE"
          PLIST=$(security cms -D -i "$PROFILE")
          UUID=$(echo "$PLIST" | plutil -extract UUID raw -)
          NAME=$(echo "$PLIST" | plutil -extract Name raw -)
          APP_ID=$(echo "$PLIST" | plutil -extract Entitlements.application-identifier raw -)
          cp "$PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          cp "$PROFILE" ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "bundle_id=${APP_ID#*.}" >> "$GITHUB_OUTPUT"

      - name: Generate the iOS project
        working-directory: apps/xenrooms
        env:
          # plugins/ios-signing puts the profile on the app target only.
          IOS_APP_PROFILE: ${{ steps.profile.outputs.uuid }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx expo prebuild --platform ios --clean

      - name: Resolve workspace and scheme
        id: xcode
        run: |
          WORKSPACE=$(ls -d apps/xenrooms/ios/*.xcworkspace | head -1)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$(basename "$WORKSPACE" .xcworkspace)" >> "$GITHUB_OUTPUT"

      - name: Build without signing
        if: steps.creds.outputs.signed != 'true'
        run: |
          xcodebuild build \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Import the distribution certificate
        if: steps.creds.outputs.signed == 'true'
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

      - name: Install the App Store Connect API key
        if: steps.creds.outputs.signed == 'true'
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_BASE64" | base64 -d > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Manual signing with the App Store profile: automatic signing would need
      # a development certificate and a registered device.
      - name: Archive
        if: steps.creds.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -workspace "${{ steps.xcode.outputs.workspace }}" \
            -scheme "${{ steps.xcode.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/XenRooms.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export the IPA
        if: steps.creds.outputs.signed == 'true'
        id: export
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ steps.profile.outputs.bundle_id }}</key><string>${{ steps.profile.outputs.name }}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/XenRooms.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          VERSION=$(tr -d '[:space:]' < apps/xenrooms/VERSION)
          DEST="xenrooms-${VERSION}-${BUILD_NUMBER}.ipa"
          cp "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.creds.outputs.signed == 'true'
        with:
          name: ${{ steps.export.outputs.path }}
          path: ${{ steps.export.outputs.path }}
          if-no-files-found: error

      - name: Upload to TestFlight
        if: steps.creds.outputs.signed == 'true' && (github.event_name == 'release' || inputs.upload_to_testflight)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA="${{ steps.export.outputs.path }}"
          xcrun altool --validate-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::Uploaded build ${BUILD_NUMBER}; TestFlight shows it after Apple's processing (5-30 minutes)."
